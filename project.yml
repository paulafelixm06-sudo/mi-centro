name: CentroDePaula
options:
  bundleIdPrefix: com.paula
  developmentLanguage: es
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    MARKETING_VERSION: "2.0"
    CURRENT_PROJECT_VERSION: "2"
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
targets:
  CentroDePaula:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Centro
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSCalendarsFullAccessUsageDescription: "Para ver tus tareas y citas de tu Centro y poder tacharlas."
        NSCalendarsUsageDescription: "Para ver tus tareas y citas de tu Centro y poder tacharlas."
        NSCameraUsageDescription: "Para hacer fotos de tus comidas y tickets desde tu Centro."
        NSPhotoLibraryUsageDescription: "Para elegir fotos de tus comidas y tickets en tu Centro."
        NSMicrophoneUsageDescription: "Para contarle cosas a tu Centro con la voz."
        NSFaceIDUsageDescription: "Para proteger tu presupuesto con Face ID."
        CFBundleDevelopmentRegion: es
        INAlternativeAppNames:
          - INAlternativeAppName: Mi Centro
          - INAlternativeAppName: Centro de Paula
          - INAlternativeAppName: Mi centro de Paula
        NSSupportsLiveActivities: true
        NSUserActivityTypes: [ApuntarIntent, GastoIntent, IngresoIntent, AnadirCompraIntent, QueTocaIntent, VerNovedadesIntent]
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.paula.centro.refrescar]
        CFBundleURLTypes:
          - CFBundleURLName: com.paula.centro
            CFBundleURLSchemes: [centro]
        UIApplicationShortcutItems:
          - UIApplicationShortcutItemType: nueva
            UIApplicationShortcutItemTitle: Nueva tarea
            UIApplicationShortcutItemIconSymbolName: square.and.pencil
          - UIApplicationShortcutItemType: gasto
            UIApplicationShortcutItemTitle: Gasto o ingreso
            UIApplicationShortcutItemIconSymbolName: eurosign.circle
          - UIApplicationShortcutItemType: comida
            UIApplicationShortcutItemTitle: Añadir comida
            UIApplicationShortcutItemIconSymbolName: fork.knife
          - UIApplicationShortcutItemType: compra
            UIApplicationShortcutItemTitle: Lista de la compra
            UIApplicationShortcutItemIconSymbolName: cart
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.paula.centro
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) APP"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: CentroWidget
        embed: true
      - target: CentroCompartir
        embed: true
  CentroWidget:
    type: app-extension
    platform: iOS
    sources:
      - Widget
      - Shared
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Centro
        CFBundleDevelopmentRegion: es
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSSupportsLiveActivities: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NSCalendarsFullAccessUsageDescription: "Para ver tus tareas y citas de tu Centro y poder tacharlas."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.paula.centro.widget
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
  CentroCompartir:
    type: app-extension
    platform: iOS
    sources:
      - Compartir
      - Shared
    info:
      path: Compartir/Info.plist
      properties:
        CFBundleDisplayName: Centro
        CFBundleDevelopmentRegion: es
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSCalendarsFullAccessUsageDescription: "Para guardar en tu Centro lo que compartes."
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).VistaCompartir"
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsWebPageWithMaxCount: 1
              NSExtensionActivationSupportsText: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.paula.centro.compartir
