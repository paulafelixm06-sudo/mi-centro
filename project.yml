name: CentroDePaula
options:
  bundleIdPrefix: com.paula
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
targets:
  CentroDePaula:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Centro
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSCalendarsFullAccessUsageDescription: "Para ver tus tareas y citas de tu Centro y poder tacharlas."
        NSCalendarsUsageDescription: "Para ver tus tareas y citas de tu Centro y poder tacharlas."
        NSCameraUsageDescription: "Para hacer fotos de tus comidas y tickets desde tu Centro."
        NSPhotoLibraryUsageDescription: "Para elegir fotos de tus comidas y tickets en tu Centro."
        NSMicrophoneUsageDescription: "Para contarle cosas a tu Centro con la voz."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.paula.centro
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: CentroWidget
        embed: true
  CentroWidget:
    type: app-extension
    platform: iOS
    sources:
      - Widget
      - Shared
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Centro
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NSCalendarsFullAccessUsageDescription: "Para ver tus tareas y citas de tu Centro y poder tacharlas."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.paula.centro.widget
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
